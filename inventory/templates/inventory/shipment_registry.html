{% extends "inventory/base.html" %}

{% block content %}
<h2>Реестр отгрузок</h2>

<table class="table table-striped table-hover table-bordered">
    <thead>
        <tr>
            <th>Дата отгрузки</th>
            <th>Клиент</th>
            <th>Товар</th>
            <th>Серийный номер</th>
        </tr>
    </thead>
    <tbody>
        {% for unit in units %}
        <tr>
            <td>{{ unit.reservation.date_of_shipment }}</td>
            <td>{{ unit.reservation.client }}</td>
            <td>{{ unit.product }}</td>
            <td>{{ unit.serial_number }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
