{% extends "inventory/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-dark"><i class="bi bi-plus-circle me-2 text-success"></i>Приёмка товара</h2>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Назад
    </a>
</div>

<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-bottom py-3">
        <h5 class="mb-0">Новая партия</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="product" class="form-label fw-medium">Товар <span class="text-danger">*</span></label>
                <div class="input-group">
                    <select name="product" id="product" class="form-select" required>
                        <option value="">-- Выберите товар --</option>
                        {% for product in products %}
                            <option value="{{ product.id }}">{{ product.name }}</option>
                        {% endfor %}
                    </select>
                    <a href="{% url 'add_product' %}" class="btn btn-outline-secondary" title="Создать новый товар">
                        <i class="bi bi-plus-lg"></i>
                    </a>
                </div>
            </div>

            <div class="mb-3">
                <label for="quantity" class="form-label fw-medium">Количество <span class="text-danger">*</span></label>
                <input type="number" name="quantity" id="quantity" class="form-control" min="1" required>
                <small class="form-text text-muted">Будут созданы единицы товара со статусом "На складе" (или "Готово" если серийник не нужен)</small>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-box-arrow-in-down"></i> Принять на склад
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
