{% extends "inventory/base.html" %}

{% block content %}

<h2>Добавление новой номенклатуры</h2>

<!-- Блок для отображения ошибок -->
{% if error %}
    <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label for="name" class="form-label">Наименование товара:</label>
        <input type="text"
               class="form-control"
               id="name"
               name="name"
               value="{{ name|default:'' }}"
               required>
    </div>

    <div class="mb-3">
        <label for="equipment_type" class="form-label">Тип оборудования:</label>
        <select class="form-select" id="equipment_type" name="equipment_type">
            <option value="">-- Выберите тип --</option>
            {% for et in equipment_types %}
                <option value="{{ et.id }}" {% if et.id == selected_equipment_type_id %}selected{% endif %}>
                    {{ et.name }}
                </option>
            {% endfor %}
        </select>
    </div>
        <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="requires_serial" name="requires_serial" checked>
        <label class="form-check-label" for="requires_serial">
            Требует серийного номера
        </label>
        <small class="form-text text-muted d-block">
            Снимите галочку для расходных материалов (створки, крепления, кабели)
        </small>
    </div>
    <div class="mb-3">
    <label for="new_equipment_type" class="form-label">Или создайте новый тип:</label>
    <input type="text" name="new_equipment_type" id="new_equipment_type" class="form-control" placeholder="Например: Интерактивные панели">
    <small class="form-text text-muted">Если нужного типа нет в списке, введите его название здесь</small>
</div>

    <button type="submit" class="btn btn-primary">Создать товар</button>
    <a href="{% url 'add_units' %}" class="btn btn-secondary">Отмена</a>
</form>

{% endblock %}
