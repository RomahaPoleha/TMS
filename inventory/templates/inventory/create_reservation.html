{% extends "inventory/base.html" %}

{% block content %}
<h2>Создать резерв</h2>

{% if error %}
    <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST" id="reservation-form">
    {% csrf_token %}

    <!-- 1. Выбор клиента -->
    <div class="mb-3">
        <label for="client" class="form-label">Клиент:</label>
        <select name="client" id="client" class="form-select">
            <option value="">-- Выберите клиента --</option>
            {% for client in clients %}
                <option value="{{ client.id }}">{{ client.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-4">
        <input type="text" name="new_client_name" class="form-control" placeholder="Или введите имя нового клиента">
        <small class="form-text text-muted">Если нужного клиента нет в списке, введите его название здесь</small>
    </div>

    <hr>

    <!-- 2. Единый список позиций (Товары + Комплекты) -->
    <h4 class="mb-3">Позиции резерва</h4>

    <div id="items-container">
        <!-- Первая строка -->
        <div class="item-row row mb-2 align-items-end">
            <div class="col-md-6">
                <label class="form-label small text-muted">Товар или Готовый комплект</label>
                <select name="item_1" class="form-select">
                    <option value="">-- Выберите позицию --</option>

                    <optgroup label="📦 Готовые комплекты">
                        {% for assembly in available_assemblies %}
                            <option value="a_{{ assembly.id }}">
                                [КОМПЛЕКТ] {{ assembly.kit.name }}
                            </option>
                        {% endfor %}
                    </optgroup>

                    <optgroup label="🔧 Отдельные товары">
                        {% for product in products %}
                            <option value="p_{{ product.id }}">
                                {{ product.name }}
                            </option>
                        {% endfor %}
                    </optgroup>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Кол-во</label>
                <input type="number" name="quantity_1" min="1" value="1" class="form-control">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-danger btn-sm remove-item" style="display:none;" title="Удалить строку">❌</button>
            </div>
        </div>
    </div>

    <button type="button" class="btn btn-secondary mb-3" id="add-item">➕ Добавить позицию</button>

    <br>
    <button type="submit" class="btn btn-primary btn-lg">Зарезервировать</button>
    <a href="{% url 'reservations' %}" class="btn btn-outline-secondary btn-lg">Отмена</a>
</form>

<script>
let itemCount = 1;

document.getElementById('add-item').addEventListener('click', function() {
    itemCount++;
    const firstRow = document.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);

    // Меняем имена полей на уникальные
    const select = newRow.querySelector('select');
    select.name = `item_${itemCount}`;
    select.value = '';

    const input = newRow.querySelector('input');
    input.name = `quantity_${itemCount}`;
    input.value = '1';

    const removeBtn = newRow.querySelector('.remove-item');
    removeBtn.style.display = 'inline-block';

    removeBtn.addEventListener('click', function() {
        newRow.remove();
    });

    document.getElementById('items-container').appendChild(newRow);
});

document.querySelector('.remove-item').addEventListener('click', function() {
    this.closest('.item-row').remove();
});
</script>

{% endblock %}
