{% extends "inventory/base.html" %}

{% block content %}
<h2>Отправить оборудование в сервис</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label for="unit" class="form-label">Выберите устройство:</label>
        <select name="unit" id="unit" class="form-select" required>
            <option value="">-- Выберите --</option>
            {% for unit in units %}
                <option value="{{ unit.id }}" data-has-serial="{% if unit.serial_number %}true{% else %}false{% endif %}">
                    {{ unit.product }}
                    {% if unit.serial_number %}— {{ unit.serial_number }}{% else %}(без серийника){% endif %}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3" id="serial-block" style="display:none;">
        <label for="serial_number" class="form-label">Серийный номер:</label>
        <input type="text" name="serial_number" id="serial_number" class="form-control">
    </div>

    <div class="mb-3">
        <label for="defect_type" class="form-label">Вид неисправности:</label>
        <div class="input-group">
            <select name="defect_type" id="defect_type" class="form-select" required>
                <option value="">-- Выберите неисправность --</option>
                {% for dt in defect_types %}
                    <option value="{{ dt.id }}">{{ dt.name }}</option>
                {% endfor %}
            </select>
            <a href="{% url 'create_defect_type' %}" class="btn btn-outline-secondary">+ Новая</a>
        </div>
    </div>

    <div class="mb-3">
        <label for="service_comment" class="form-label">Комментарий:</label>
        <textarea name="service_comment" id="service_comment" class="form-control" rows="3" required></textarea>
    </div>

    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">🔧 Отправить в сервис</button>
        <a href="{% url 'service' %}" class="btn btn-secondary">❌ Отмена</a>
    </div>
</form>

<script>
document.getElementById('unit').addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    const hasSerial = selectedOption.getAttribute('data-has-serial');
    const serialBlock = document.getElementById('serial-block');
    const serialInput = document.getElementById('serial_number');

    if (hasSerial === 'false') {
        serialBlock.style.display = 'block';
        serialInput.required = true;
    } else {
        serialBlock.style.display = 'none';
        serialInput.required = false;
        serialInput.value = '';
    }
});
</script>

{% endblock %}
