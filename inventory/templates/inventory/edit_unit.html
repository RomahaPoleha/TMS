{% extends "inventory/base.html" %}

{% block content %}



<h2>Редактирование устройства</h2>
<h3>Текущий серийный номер: {{ unit.serial_number }}</h3>

<form method="POST">
    {% csrf_token %}
        <div class="mb-3">
        <label for="product" class="form-label">Товар:</label>
        <select name="product" id="product" class="form-select" required>
            {% for product in products %}
                <option value="{{ product.id }}" {% if product.id == unit.product.id %}selected{% endif %}>
                    {{ product.name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="serial_number" class="form-label">Серийный номер:</label>
        <input type="text"
               name="serial_number"
               id="serial_number"
               class="form-control"
               value="{{ unit.serial_number }}"
               required>
    </div>

<div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
        <a href="{% url 'unit_list' %}" class="btn btn-secondary">❌ Отмена</a>
    </div>
</form>

{% endblock %}
