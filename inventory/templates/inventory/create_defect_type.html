{% extends "inventory/base.html" %}

{% block content %}

<h2>Добавить тип неисправности</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}


<form method="POST">
    {% csrf_token %}

<div class="mb-3">
        <label for="defect_type" class="form-label">Неисправность:</label>
        <input type="text" name="defect_type" id="defect_type" class="form-control" required>
    </div>
  <button type="submit" class="btn btn-primary">Добавить неисправность</button>
  <a href="{% url 'add_to_service' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
